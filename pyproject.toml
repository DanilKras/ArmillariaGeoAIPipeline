[project]
name = "armillariageoaipipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "apache-airflow>=3.3.2",
    "dask>=2026.8.0",
    "duckdb>=1.5.5",
    "folium>=0.20.0",
    "fsspec>=2026.7.0",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pandas-stubs~=3.0.5",
    "planetary-computer>=1.0.0",
    "pygbif>=0.6.6",
    "pystac-client>=0.9.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "scipy-stubs~=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "spatial-kfold>=0.0.4",
    "streamlit>=1.64.0",
    "streamlit-folium>=0.27.4",
    "xarray>=2026.7.0",
    "xgboost>=3.4.1",
    "zarr>=3.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
